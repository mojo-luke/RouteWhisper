plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.routewhisper.route_whisper_app"
    compileSdk flutter.compileSdkVersion
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.routewhisper.route_whisper_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 21
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
  // Mapbox Navigation SDK for NDK 27
  implementation "com.mapbox.navigationcore:android:3.10.0"  // Core Navigation SDK functionality
  implementation "com.mapbox.navigationcore:ui-components:3.10.0"  // UI components (route line, camera, etc.)

  // AndroidX dependencies
  implementation "androidx.appcompat:appcompat:1.6.1"  // For AppCompatActivity

  // Testing dependencies
  testImplementation "junit:junit:4.13.2"
  testImplementation "io.mockk:mockk:1.13.8"  // Kotlin mocking library
  testImplementation "org.robolectric:robolectric:4.11.1"  // Android framework for unit tests
  testImplementation "androidx.test:core:1.5.0"  // AndroidX test core
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3"  // Coroutines testing
  testImplementation "org.jetbrains.kotlin:kotlin-test:1.9.10"  // Kotlin test assertions
}

flutter {
    source '../..'
}