org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# MAPBOX_DOWNLOADS_TOKEN (secret sk. token, scope DOWNLOADS:READ) is NOT
# stored here. Put it in ~/.gradle/gradle.properties (user-level, outside the
# repo) or pass -PMAPBOX_DOWNLOADS_TOKEN=... / ORG_GRADLE_PROJECT_MAPBOX_DOWNLOADS_TOKEN.